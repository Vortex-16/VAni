# Cloud Run environment variables for the VAni backend.
#
# HOW TO USE
#   1. Copy this file to  scripts/cloudrun.env.yaml  (that name is git-ignored).
#   2. Fill in the real values below.
#   3. Deploy — scripts/deploy.ps1 passes it automatically via --env-vars-file,
#      or run manually:
#        gcloud run deploy discharge-buddy-backend --source . \
#          --region asia-south1 --allow-unauthenticated \
#          --env-vars-file scripts/cloudrun.env.yaml
#
# NOTE: do NOT add a PORT key here — Cloud Run injects PORT=8080 itself and
#       rejects deployments that try to set it. The app already reads PORT.
#
# Values must be strings (quote anything with special characters). For multi-line
# secrets like FIREBASE_PRIVATE_KEY, keep the literal "\n" sequences in one line.

# ── Required: the app crashes at startup without this ──
DATABASE_URL: "postgresql://USER:PASSWORD@HOST:5432/DBNAME?sslmode=require"

# ── AI / voice ──
GROQ_API_KEY: "your_groq_api_key"
ANTHROPIC_API_KEY: "your_anthropic_api_key"
GOOGLE_API_KEY: "your_google_generative_ai_key"

# ── Auth ──
JWT_SECRET: "a_long_random_secret"
GOOGLE_CLIENT_ID: "xxxxx.apps.googleusercontent.com"

# ── Firebase Admin (push notifications) ──
FIREBASE_PROJECT_ID: "your-firebase-project-id"
FIREBASE_CLIENT_EMAIL: "firebase-adminsdk-xxxx@your-project.iam.gserviceaccount.com"
FIREBASE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nMIIE...\n-----END PRIVATE KEY-----\n"

# ── OCR microservice ──
OCR_SERVICE_URL: "https://your-ocr-service-url"

# ── Email (optional) ──
SMTP_HOST: ""
SMTP_PORT: "587"
SMTP_USER: ""
SMTP_PASS: ""
SMTP_FROM: ""

# ── Misc (optional) ──
LOG_LEVEL: "info"
DEV_USER_EMAIL: ""
DEV_USER_PASSWORD: ""
CAREGIVER_DOMAIN_HINTS: ""
